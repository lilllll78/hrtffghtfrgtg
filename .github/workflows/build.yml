name: Build Chest Method
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
 
      - name: Show files
        run: ls -laR . | grep -v '^\./\.git' | head -80
 
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
 
      # Gradle 8.12 dispo en secours si gradlew est absent
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.12"
 
      - name: Build
        run: |
          BG=$(find . -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$BG" ]; then
            echo "::error::build.gradle introuvable dans le repo. Mets le contenu du zip dans le repo."
            exit 1
          fi
          DIR=$(dirname "$BG")
          echo "Projet trouve dans : $DIR"
          cd "$DIR"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            echo "gradlew/wrapper absent, utilisation de gradle 8.12"
            gradle build --no-daemon --stacktrace
          fi
 
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: chestmethod-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
 
      - name: Create release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
 
